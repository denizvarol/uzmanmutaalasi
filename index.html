<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Uzman İnceleme | Bakım Çalışması</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% 20%, #17365f 0%, #0b1f3a 45%, #061426 100%);
            color: #ffffff;
        }

        .maintenance {
            width: 100%;
            max-width: 720px;
            text-align: center;
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 28px;
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -2px;
            background: rgba(255,255,255,.06);
        }

        h1 {
            font-size: clamp(34px, 6vw, 58px);
            line-height: 1.1;
            margin-bottom: 22px;
            font-weight: 700;
        }

        .line {
            width: 70px;
            height: 3px;
            margin: 0 auto 26px;
            background: #c6a15b;
            border-radius: 10px;
        }

        p {
            max-width: 570px;
            margin: 0 auto;
            font-size: 18px;
            line-height: 1.7;
            color: rgba(255,255,255,.78);
        }

        .brand {
            margin-top: 46px;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,.45);
        }
    </style>
</head>

<body>

    <main class="maintenance">

        <div class="logo">Uİ</div>

        <h1>Bakım Çalışması</h1>

        <div class="line"></div>

        <p>
            Web sitemizde güncelleme ve bakım çalışmaları gerçekleştirilmektedir.
            Kısa süre içerisinde yeniden hizmetinizde olacağız.
        </p>

        <div class="brand">
            UZMAN İNCELEME
        </div>

    </main>

</body>
</html>
